<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Driftwood</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css">
    <link rel="icon" href="/img/favicon.svg">
</head>
<body>
    <div id="map"></div>

    <div id="header-bar" class="floating-panel top-left">
        <div class="header-row">
            <span class="logo">MR DRIFTWOOD</span>
            <div id="device-status" class="device-indicator">
                <span class="device-dot"></span>
                <span class="device-label">No device</span>
            </div>
            <button id="btn-kawaii" class="btn-ghost" title="Toggle kawaii mode">✿</button>
        </div>
    </div>

    <div id="map-layer-control" class="floating-panel layer-control">
        <button id="btn-map-layer" class="btn-ghost" title="Map layer: streets">Map</button>
        <button id="btn-route-provider" class="btn-ghost" title="Routing provider: OSRM">OSRM</button>
    </div>

    <div id="waypoint-panel" class="floating-panel right">
        <div class="panel-header">
            <h3>Route</h3>
            <div class="route-actions">
                <button id="btn-fit" title="Fit route in view">Fit</button>
                <button id="btn-save" title="Save route">Save</button>
                <button id="btn-load" title="Load route">Load</button>
                <button id="btn-clear" title="Clear route">Clear</button>
            </div>
        </div>
        <div class="route-options">
            <label class="toggle-label">
                <input type="checkbox" id="snap-toggle">
                <span>Snap to roads</span>
            </label>
            <div class="gpx-actions">
                <button id="btn-gpx-import" class="btn-small">Import GPX</button>
                <button id="btn-gpx-export" class="btn-small">Export GPX</button>
            </div>
        </div>
        <ul id="waypoint-list"></ul>
        <div id="route-empty" class="empty-state">Click the map to add waypoints</div>
    </div>

    <div id="playback-bar" class="floating-panel bottom">
        <div id="scrub-container">
            <div id="scrub-bar">
                <div id="scrub-progress"></div>
                <div id="scrub-handle"></div>
            </div>
        </div>
        <div class="playback-row">
            <div class="playback-controls">
                <button id="btn-play" class="btn-icon" title="Play">&#9654;</button>
                <button id="btn-pause" class="btn-icon" title="Pause" hidden>&#10074;&#10074;</button>
                <button id="btn-stop" class="btn-icon" title="Stop">&#9632;</button>
            </div>
            <div id="speed-unit-toggle" class="unit-toggle">
                <button type="button" class="unit-btn active" data-unit="mph">mph</button>
                <button type="button" class="unit-btn" data-unit="mps">m/s</button>
            </div>
            <div class="speed-control">
                <input type="range" id="speed-slider" min="0.5" max="160" step="0.1" value="3.1">
                <span id="speed-label">3.1 mph</span>
            </div>
            <div class="speed-presets">
                <button data-speed="1.4" data-min="0.2" data-max="2.7"   class="preset active" data-kawaii="✿">Walk</button>
                <button data-speed="2.8" data-min="1.5" data-max="6.0"   class="preset"        data-kawaii="❀">Jog</button>
                <button data-speed="5.5" data-min="3.0" data-max="14.0"  class="preset"        data-kawaii="♡">Bike</button>
                <button data-speed="13.4" data-min="4.0" data-max="71.53" class="preset"       data-kawaii="✦">Drive</button>
            </div>
            <div class="update-rate-control">
                <button id="btn-update-rate" class="btn-ghost" title="Location push rate">Rate</button>
                <div id="update-rate-panel" hidden>
                    <input type="range" id="update-rate-slider" min="0.25" max="50" step="0.25" value="0.25">
                    <span id="update-rate-label">0.25s</span>
                </div>
            </div>
            <div class="loop-controls">
                <button id="btn-loop" class="btn-icon" data-mode="none" title="Loop: off">&#8635;</button>
                <button id="btn-follow" class="btn-icon" title="Auto-follow: off">⊙</button>
            </div>
        </div>
        <div id="stats-bar">
            <span class="stat"><span class="stat-label">Speed</span><span id="stat-speed">0 m/s</span></span>
            <span class="stat"><span class="stat-label">Distance</span><span id="stat-distance">0 m</span></span>
            <span class="stat"><span class="stat-label">Elapsed</span><span id="stat-elapsed">0:00</span></span>
            <span class="stat"><span class="stat-label">Remaining</span><span id="stat-remaining">--:--</span></span>
            <span class="stat"><span class="stat-label">Coords</span><span id="stat-coords">--</span></span>
        </div>
    </div>

    <div id="realism-panel" class="floating-panel bottom-left">
        <div class="realism-title">Realism</div>
        <label class="toggle-label"><input type="checkbox" id="jitter-toggle" checked><span>Jitter</span></label>
        <label class="toggle-label"><input type="checkbox" id="easing-toggle" checked><span>Easing</span></label>
        <label class="toggle-label"><input type="checkbox" id="drift-toggle" checked><span>Drift</span></label>
    </div>

    <div id="modal-overlay" class="modal-overlay" hidden>
        <div id="modal-content" class="modal"></div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
