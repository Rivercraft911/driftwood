[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwood"
version = "0.1.0"
description = "Local GPS route simulation for iOS devices"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pymobiledevice3>=4.0",
    "httpx>=0.25",
    "click>=8.1",
    "pydantic>=2.5",
]

[project.scripts]
driftwood = "driftwood.cli:main"

[tool.setuptools.packages.find]
include = ["driftwood*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
